services:
  shrewsoft:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: shrew-vpn-container
    image: vpn-image
    network_mode: "host"
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/root/.Xauthority
      - ./ike_github_repo/ike:/shrewsoft_vpn_container
      - ./vpn_files:/vpn_files
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh
      - ./write_vpn_config.sh:/usr/local/bin/write_vpn_config.sh
    environment:
      - DISPLAY=${DISPLAY}
      - VPN_FILE_USERNAME=${VPN_FILE_USERNAME}
      - VPN_FILE_PASSWORD=${VPN_FILE_PASSWORD}
    env_file:
      - .env
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN  # Allows network-related operations
      - NET_RAW  # Allows raw socket operations
